<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071017">
<title>KAVALER — Фриланс • Дизайн • Разработка</title>
<style>
:root{
  --bg:#050a0e; --glass:rgba(7,14,20,.67); --glass2:rgba(8,16,22,.88);
  --line:rgba(211,235,245,.22); --line2:rgba(211,235,245,.42);
  --text:#eef7fa; --muted:#9eacb2; --soft:#cbdde3; --glow:rgba(190,232,255,.27);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; min-height:100vh; color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#04080b url("assets/background.jpg") center/cover fixed no-repeat;
  overflow-x:hidden;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:radial-gradient(circle at 50% 38%,transparent 0,rgba(0,0,0,.16) 45%,rgba(0,0,0,.62) 100%);
}
button,a{font:inherit}
button{color:inherit}
.page{
  width:min(720px,calc(100% - 26px)); min-height:100vh;
  margin:auto; padding:34px 0 42px;
}
.card{
  min-height:calc(100vh - 76px); padding:38px 50px 28px;
  border:1px solid var(--line); border-radius:28px;
  background:linear-gradient(145deg,rgba(12,22,29,.76),rgba(4,10,14,.65));
  box-shadow:0 30px 100px rgba(0,0,0,.56), inset 0 0 50px rgba(190,232,255,.025);
  backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);
  position:relative;overflow:hidden;
}
.card:after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(110deg,transparent 20%,rgba(255,255,255,.055) 50%,transparent 80%);
  transform:translateX(-120%);animation:sheen 9s ease-in-out infinite;
}
@keyframes sheen{0%,72%{transform:translateX(-120%)}88%,100%{transform:translateX(120%)}}

.hero{display:flex;flex-direction:column;align-items:center;text-align:center}
.avatar{
  width:116px;height:116px;border-radius:50%;object-fit:cover;
  border:2px solid rgba(238,249,253,.88);
  box-shadow:0 0 22px rgba(205,237,250,.22),0 0 70px rgba(115,170,195,.12);
  opacity:0;transform:translateY(-38px) scale(.9);
  animation:drop .9s cubic-bezier(.2,.8,.2,1) .05s forwards;
}
.name{
  margin-top:18px;font-size:38px;font-weight:300;letter-spacing:.38em;padding-left:.38em;
  opacity:0;transform:translateY(-28px);animation:drop .8s cubic-bezier(.2,.8,.2,1) .17s forwards;
}
.tagline{
  max-width:600px;margin:12px 0 30px;color:#aebdc2;font-size:14px;line-height:1.6;
  opacity:0;transform:translateY(-22px);animation:drop .8s cubic-bezier(.2,.8,.2,1) .29s forwards;
}
@keyframes drop{to{opacity:1;transform:none}}

.menu{display:grid;gap:9px}
.menu-btn{
  width:100%;display:flex;align-items:center;gap:18px;padding:15px 18px;
  border:1px solid var(--line);border-radius:16px;background:rgba(7,15,20,.48);
  cursor:pointer;text-align:left;position:relative;overflow:hidden;
  opacity:0;transform:translateX(-25px);
  animation:slide .65s cubic-bezier(.2,.8,.2,1) forwards;
  transition:transform .25s,border-color .25s,box-shadow .25s,background .25s;
}
.menu-btn:nth-child(1){animation-delay:.38s}.menu-btn:nth-child(2){animation-delay:.45s}
.menu-btn:nth-child(3){animation-delay:.52s}.menu-btn:nth-child(4){animation-delay:.59s}
.menu-btn:nth-child(5){animation-delay:.66s}.menu-btn:nth-child(6){animation-delay:.73s}
@keyframes slide{to{opacity:1;transform:none}}
.menu-btn:before{
  content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(221,244,255,.12),transparent 28%);
  opacity:0;transition:opacity .25s;
}
.menu-btn:hover:before{opacity:1}
.menu-btn:hover{
  transform:translateY(-3px) scale(1.008);border-color:var(--line2);
  box-shadow:0 12px 34px rgba(0,0,0,.25),0 0 22px var(--glow);
  background:rgba(11,22,29,.65);
}
.menu-btn:active{transform:scale(.975)}
.icon{
  width:31px;text-align:center;font-size:26px;line-height:1;color:#c8e0e8;
  filter:drop-shadow(0 0 8px rgba(200,230,240,.12));transition:.25s;
}
.menu-btn:hover .icon{transform:rotate(-5deg) scale(1.12);filter:drop-shadow(0 0 11px rgba(210,240,250,.35))}
.copy{display:grid;gap:3px;position:relative}
.copy strong{font-size:14px;font-weight:400;letter-spacing:.17em}
.copy span{font-size:11px;color:#7e8f95}
.arrow{margin-left:auto;font-size:26px;color:#b9cbd1;transition:.25s}
.menu-btn:hover .arrow{transform:translateX(6px);color:#fff}

.divider{height:1px;background:var(--line);margin:28px 0 17px}
.motto{text-align:center;color:#89999f;font-size:12px;letter-spacing:.03em;margin-bottom:14px}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.chip{
  border:1px solid var(--line);border-radius:13px;padding:11px 8px;
  background:rgba(7,15,20,.45);cursor:pointer;color:#b8c9ce;
  transition:.25s;opacity:0;animation:fadeUp .65s ease 1.0s forwards;
}
.chip:nth-child(2){animation-delay:1.06s}
.chip:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:0 0 20px var(--glow);color:#fff}
.chip:active{transform:scale(.96)}
@keyframes fadeUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}

.socials{display:flex;justify-content:center;gap:25px;margin-top:22px}
.social{
  border:0;background:transparent;color:#d5e6eb;font-size:22px;cursor:pointer;padding:4px;
  transition:.25s;opacity:0;animation:fadeUp .6s ease 1.15s forwards;
}
.social:nth-child(2){animation-delay:1.2s}.social:nth-child(3){animation-delay:1.25s}.social:nth-child(4){animation-delay:1.3s}
.social:hover{transform:translateY(-4px) scale(1.12);text-shadow:0 0 16px rgba(220,245,255,.6)}

.view{
  position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
  padding:20px;background:rgba(1,5,8,.62);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.view.open{display:flex}
.panel{
  width:min(650px,100%);max-height:min(780px,calc(100vh - 40px));overflow:auto;
  padding:30px;border:1px solid var(--line2);border-radius:24px;background:var(--glass2);
  box-shadow:0 35px 100px rgba(0,0,0,.65),0 0 40px rgba(190,232,255,.06);
  animation:panelIn .3s cubic-bezier(.2,.8,.2,1);
}
@keyframes panelIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.panel h2{margin:0 42px 8px 0;font-weight:350;letter-spacing:.12em}
.panel .sub{margin:0 0 22px;color:#87979c;font-size:12px;line-height:1.6}
.close{
  position:absolute;top:12px;right:15px;border:0;background:transparent;color:#aabac0;
  font-size:30px;cursor:pointer;transition:.2s
}
.close:hover{color:#fff;transform:rotate(90deg)}
.panel-wrap{position:relative}
.back{
  margin-top:22px;width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;
  background:rgba(255,255,255,.025);cursor:pointer;color:#b9c9ce;transition:.2s
}
.back:hover{border-color:var(--line2);box-shadow:0 0 20px var(--glow);transform:translateY(-2px)}
.content-list{display:grid;gap:10px}
.info-row,.link-row{
  padding:15px 16px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.025)
}
.info-row strong{display:block;font-weight:400;margin-bottom:5px}
.info-row span{color:#8d9da2;font-size:12px;line-height:1.55}
.link-row{display:flex;align-items:center;justify-content:space-between;gap:15px}
.link-row a,.link-row button{color:#e5f3f7;text-decoration:none;background:none;border:0;cursor:pointer}
.link-row a:hover,.link-row button:hover{text-shadow:0 0 12px rgba(220,245,255,.6)}

.quote{padding:18px;border-left:2px solid rgba(210,239,250,.55);background:rgba(255,255,255,.025);color:#dce9ec;line-height:1.7;font-size:14px}
.notice{color:#aab9be;line-height:1.7;font-size:14px}
.price-note{font-size:14px;line-height:1.7;color:#d7e5e8}
.ok{
  width:100%;margin-top:22px;padding:12px;border:1px solid rgba(222,244,252,.45);border-radius:12px;
  background:rgba(207,238,248,.09);cursor:pointer;transition:.2s
}
.ok:hover{background:rgba(207,238,248,.16);box-shadow:0 0 20px var(--glow);transform:translateY(-2px)}

.toast{
  position:fixed;left:50%;bottom:22px;z-index:50;transform:translate(-50%,20px);opacity:0;
  padding:10px 15px;border:1px solid var(--line);border-radius:99px;background:rgba(5,12,16,.93);
  color:#d9e9ed;font-size:12px;transition:.25s;pointer-events:none
}
.toast.show{opacity:1;transform:translate(-50%,0)}

#sparkles{position:fixed;inset:0;pointer-events:none;z-index:60}
.spark{position:fixed;width:3px;height:3px;border-radius:50%;background:white;box-shadow:0 0 9px 2px rgba(255,255,255,.75);animation:spark .7s ease-out forwards}
@keyframes spark{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(0)}}

@media(max-width:620px){
  .page{width:calc(100% - 14px);padding:10px 0 20px}
  .card{min-height:calc(100vh - 30px);padding:27px 14px 20px;border-radius:23px}
  .avatar{width:92px;height:92px}.name{font-size:28px;letter-spacing:.3em;padding-left:.3em}
  .tagline{font-size:12px;margin-bottom:24px}
  .menu-btn{padding:14px 13px}.copy strong{font-size:12px}.copy span{font-size:10px}.icon{font-size:22px;width:25px}
  .panel{padding:25px 18px;border-radius:20px}.panel h2{font-size:19px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<canvas id="sparkles"></canvas>

<main class="page">
  <section class="card">
    <header class="hero">
      <img class="avatar" src="assets/avatar.png" alt="KAVALER">
      <div class="name">KAVALER</div>
      <div class="tagline">Пока другие выстраивают стены из отговорок, ищущие возводят мосты из опыта — только так и покоряется этот мир</div>
    </header>

    <nav class="menu">
      <button class="menu-btn" data-view="services"><div class="icon">▣</div><div class="copy"><strong>МОИ УСЛУГИ</strong><span>Что я делаю</span></div><div class="arrow">→</div></button>
      <button class="menu-btn" data-view="portfolio"><div class="icon">✒</div><div class="copy"><strong>ПОРТФОЛИО</strong><span>Мои работы</span></div><div class="arrow">→</div></button>
      <button class="menu-btn" data-view="price"><div class="icon">▤</div><div class="copy"><strong>ПРАЙС-ЛИСТ</strong><span>Цены и условия</span></div><div class="arrow">→</div></button>
      <button class="menu-btn" data-view="about"><div class="icon">▤</div><div class="copy"><strong>ОБО МНЕ</strong><span>Немного информации</span></div><div class="arrow">→</div></button>
      <button class="menu-btn" data-view="contact"><div class="icon">✉</div><div class="copy"><strong>СВЯЗАТЬСЯ СО МНОЙ</strong><span>Написать мне</span></div><div class="arrow">→</div></button>
      <button class="menu-btn" data-view="reviews"><div class="icon">★</div><div class="copy"><strong>ОТЗЫВЫ</strong><span>Что говорят клиенты</span></div><div class="arrow">→</div></button>
    </nav>

    <div class="divider"></div>
    <div class="motto">Давайте создадим что-то крутое вместе ✦</div>

    <div class="chips">
      <button class="chip" data-view="design">✎ &nbsp; ДИЗАЙН</button>
      <button class="chip" data-view="team">⌁ &nbsp; МОЯ КОМАНДА</button>
    </div>

    <div class="socials">
      <button class="social" data-action="vk" title="VK">ᴠᴋ</button>
      <button class="social" data-action="telegram" title="Telegram">➤</button>
      <button class="social" data-action="email" title="Email">✉</button>
      <button class="social" data-action="github" title="GitHub">◉</button>
    </div>
  </section>
</main>

<!-- One reusable internal view -->
<div class="view" id="view">
  <div class="panel-wrap">
    <button class="close" id="viewClose">×</button>
    <section class="panel" id="panel"></section>
  </div>
</div>

<!-- Confirmation modal -->
<div class="view" id="confirmView">
  <div class="panel-wrap">
    <button class="close" id="confirmClose">×</button>
    <section class="panel">
      <h2 id="confirmTitle">Перейти на страницу?</h2>
      <p class="sub" id="confirmText">Вы уверены, что хотите перейти по внешней ссылке?</p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <button class="ok" id="confirmNo">Нет</button>
        <button class="ok" id="confirmYes">Да, перейти</button>
      </div>
    </section>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
/* =========================
   НАСТРОЙКИ — РЕДАКТИРОВАТЬ ЗДЕСЬ
   ========================= */
const CONFIG = {
  telegram: "https://t.me/Cockka",
  email: "mailto:Weironn@mail.ru",
  vk: "https://vk.ru/ctpahhikk",
  github: "https://github.com/cockka",
  portfolio: "https://github.com/cockka/My-works-portfolio",
  team: "https://t.me/+PIpIL_bz5gVjMDk6",
  referral: "https://pocket-friends.co/r/wxm50vjldj"
};

const views = {
  services: `
    <h2>Мои услуги</h2><p class="sub">Чем могу быть полезен</p>
    <div class="content-list">
      <div class="info-row"><strong>Монтаж</strong><span>Создание и обработка видеоконтента, в том числе мобильный монтаж.</span></div>
      <div class="info-row"><strong>Дизайн</strong><span>Визуальные решения, оформление и работа с графикой.</span></div>
      <div class="info-row"><strong>Менеджмент</strong><span>Организация задач, коммуникация и сопровождение проектов.</span></div>
      <div class="info-row"><strong>Простая веб-разработка</strong><span>Одностраничные сайты, простая вёрстка и интерактивные элементы.</span></div>
    </div>
    <button class="back" data-back>← Назад</button>
  `,
  portfolio: `
    <h2>Портфолио</h2><p class="sub">Мои работы и проекты</p>
    <div class="link-row"><span>My works portfolio</span><button data-external="${"portfolio"}">Открыть →</button></div>
    <button class="back" data-back>← Назад</button>
  `,
  price: `
    <h2>Прайс-лист</h2><p class="sub">Стоимость работы</p>
    <div class="price-note">Я не могу устанавливать фиксированную цену за свои работы, так как каждый заказчик требует работу разного уровня сложности, объёма и времени.<br><br><strong>Стоимость обсуждается индивидуально</strong> после уточнения задачи.</div>
    <button class="ok" data-back>Ок</button>
  `,
  about: `
    <h2>Обо мне</h2><p class="sub">Немного обо мне и моём пути</p>
    <div class="quote">«Я лишь стараюсь познать этот мир таким, каким мне предоставилась возможность».</div>
    <div class="notice" style="margin-top:18px">
      В свои 19 лет я не ищу идеальных условий и не жду подходящего момента, а сам создаю свой путь.<br><br>
      <strong>Мобильный монтаж:</strong> создаю видеоконтент прямо на смартфоне, находя выразительные решения в условиях ограниченных ресурсов.<br><br>
      <strong>Веб-разработка и Python:</strong> осваиваю программирование с нуля и создаю свои первые рабочие проекты.<br><br>
      <strong>Трейдинг:</strong> имею за плечами уже 5 лет практического опыта, преимущественно торгуя на платформах Pocket Option, Bybit и Binance.
    </div>
    <button class="back" data-back>← Назад</button>
  `,
  contact: `
    <h2>Связаться со мной</h2><p class="sub">Основные способы связи</p>
    <div class="content-list">
      <div class="link-row"><span>Telegram</span><button data-direct="${"telegram"}">Открыть диалог →</button></div>
      <div class="link-row"><span>Email</span><button data-direct="${"email"}">Написать →</button></div>
      <div class="link-row"><span>ВКонтакте</span><button data-vk>Открыть →</button></div>
    </div>
    <button class="back" data-back>← Назад</button>
  `,
  reviews: `
    <h2>Отзывы</h2><p class="sub">Раздел пока находится в разработке</p>
    <div class="notice">Данный пункт находится в разработке. Если вам интересно, свяжитесь со мной любым способом, чтобы получить необходимую дополнительную информацию.</div>
    <div class="content-list" style="margin-top:20px">
      <div class="link-row"><span>Telegram</span><button data-direct="${"telegram"}">Написать →</button></div>
      <div class="link-row"><span>Email</span><button data-direct="${"email"}">Написать →</button></div>
      <div class="link-row"><span>ВКонтакте</span><button data-vk>Открыть →</button></div>
    </div>
    <button class="back" data-back>← Назад</button>
  `,
  design: `
    <h2>Дизайн</h2><p class="sub">Направление работы</p>
    <div class="notice">Здесь можно позже разместить конкретные услуги по дизайну, примеры работ и условия.</div>
    <button class="back" data-back>← Назад</button>
  `,
  team: `
    <h2>Моя команда</h2><p class="sub">Совместные проекты и команда</p>
    <div class="notice">Переход ведёт на рабочую страницу команды.</div>
    <button class="ok" data-external="${"team"}">Перейти →</button>
    <button class="back" data-back>← Назад</button>
  `
};

const view = document.getElementById("view");
const panel = document.getElementById("panel");
const confirmView = document.getElementById("confirmView");
const toast = document.getElementById("toast");
let pendingUrl = null;

function showView(name){
  panel.innerHTML = views[name] || views.services;
  view.classList.add("open");
  document.body.style.overflow="hidden";
  panel.querySelectorAll("[data-back]").forEach(b=>b.onclick=closeView);
  panel.querySelectorAll("[data-external]").forEach(b=>b.onclick=()=>askExternal(CONFIG[b.dataset.external]));
  panel.querySelectorAll("[data-direct]").forEach(b=>b.onclick=()=>directOpen(CONFIG[b.dataset.direct]));
  panel.querySelectorAll("[data-vk]").forEach(b=>b.onclick=showVkWarning);
}
function closeView(){
  view.classList.remove("open");
  if(!confirmView.classList.contains("open")) document.body.style.overflow="";
}
document.querySelectorAll("[data-view]").forEach(b=>b.addEventListener("click",()=>showView(b.dataset.view)));
document.getElementById("viewClose").onclick=closeView;
view.addEventListener("click",e=>{if(e.target===view)closeView()});

function directOpen(url){ window.location.href=url; }
function askExternal(url){
  pendingUrl=url;
  document.getElementById("confirmTitle").textContent="Уверены, что хотите перейти?";
  document.getElementById("confirmText").textContent="Вы покидаете сайт KAVALER и переходите на внешнюю страницу.";
  confirmView.classList.add("open"); document.body.style.overflow="hidden";
}
function showVkWarning(){
  pendingUrl=CONFIG.vk;
  document.getElementById("confirmTitle").textContent="Важное предупреждение";
  document.getElementById("confirmText").textContent="Учтите, что используемая мной страница ВКонтакте является рабочей, а не основной. После подтверждения вы перейдёте на неё.";
  confirmView.classList.add("open"); document.body.style.overflow="hidden";
}
document.getElementById("confirmYes").onclick=()=>{if(pendingUrl)window.location.href=pendingUrl};
document.getElementById("confirmNo").onclick=()=>{pendingUrl=null;confirmView.classList.remove("open");if(!view.classList.contains("open"))document.body.style.overflow=""};
document.getElementById("confirmClose").onclick=()=>document.getElementById("confirmNo").click();
confirmView.addEventListener("click",e=>{if(e.target===confirmView)document.getElementById("confirmNo").click()});

// Social icons
document.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>{
  const type=b.dataset.action;
  if(type==="vk") showVkWarning();
  else if(type==="telegram") directOpen(CONFIG.telegram);
  else if(type==="email") directOpen(CONFIG.email);
  else if(type==="github") askExternal(CONFIG.github);
});

// Mouse-follow glow
document.querySelectorAll(".menu-btn").forEach(b=>{
  b.addEventListener("pointermove",e=>{
    const r=b.getBoundingClientRect();
    b.style.setProperty("--mx",((e.clientX-r.left)/r.width*100)+"%");
    b.style.setProperty("--my",((e.clientY-r.top)/r.height*100)+"%");
  });
});

// Click sparkles on desktop/touch
document.addEventListener("pointerdown",e=>{
  if(e.target.closest("button,.social,a")) makeSparkles(e.clientX,e.clientY,6);
});
function makeSparkles(x,y,n=7){
  const root=document.body;
  for(let i=0;i<n;i++){
    const s=document.createElement("i");s.className="spark";
    s.style.left=x+"px";s.style.top=y+"px";
    s.style.setProperty("--dx",(Math.random()*70-35)+"px");
    s.style.setProperty("--dy",(Math.random()*70-35)+"px");
    root.appendChild(s);setTimeout(()=>s.remove(),750);
  }
}

// Cursor sparkle trail on desktop, deliberately sparse
let lastSpark=0;
document.addEventListener("pointermove",e=>{
  if(e.pointerType!=="mouse" || Date.now()-lastSpark<75)return;
  lastSpark=Date.now();
  if(Math.random()<.42) makeSparkles(e.clientX,e.clientY,1);
});
</script>
</body>
</html>
